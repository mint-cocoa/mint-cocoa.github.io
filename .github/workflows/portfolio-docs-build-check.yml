name: Portfolio docs build check

on:
  push:
    branches:
      - integrate-portfolio-docs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hub
        uses: actions/checkout@v4

      - name: Checkout portfolio documents
        uses: actions/checkout@v4
        with:
          repository: mint-cocoa/portfolio
          ref: master
          path: _repos/docs/portfolio

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build hub and portfolio docs
        run: npm run build

      - name: Verify expected Pages paths
        run: |
          test -f _site/index.html
          test -f _site/portfolio/index.html
          test -f _site/portfolio/server/ServerCorePortfolio.html
          test -f _site/portfolio/client/ClientPortfolio.html
          test -f _site/portfolio/devops/DevOpsPortfolio.html
          test -f _site/portfolio/devops/OpsDashboard.html
          test -f _site/portfolio/devops/assets/DevOpsPortfolio.js
          test -f _site/portfolio/devops/assets/OpsDashboard.js

      - name: Upload built site artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-site-preview
          path: _site
