<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 40 1000 720" role="img">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1e1e"/></marker></defs>
<rect x="40" y="40" width="1000" height="720" fill="#ffffff"/>
<text x="105" y="85.5" text-anchor="start" font-family="Arial, sans-serif" font-size="28" fill="#1e1e1e"><tspan x="105" dy="0">RunOnOwner: 호출 thread와 Session owner를 분리</tspan></text>
<rect x="85" y="165" width="190" height="75" rx="12" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<text x="180" y="197.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="180" dy="0">caller thread</tspan><tspan x="180" dy="23">other worker/ring</tspan></text>
<rect x="350" y="165" width="190" height="75" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="445" y="197.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="445" dy="0">Session API</tspan><tspan x="445" dy="23">Send(payload)</tspan></text>
<polygon points="710,137 795,202 710,267 625,202" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
<text x="710" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="710" dy="0">owner ring</tspan><tspan x="710" dy="23">현재 실행?</tspan></text>
<rect x="100" y="350" width="230" height="75" rx="12" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
<text x="215" y="382.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="215" dy="0">다른 ring이면</tspan><tspan x="215" dy="23">owner queue에 task post</tspan></text>
<polygon points="480,322 565,387 480,452 395,387" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
<text x="480" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="480" dy="0">weak.lock()</tspan><tspan x="480" dy="23">성공?</tspan></text>
<rect x="675" y="350" width="240" height="80" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="795" y="373.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="795" dy="0">owner ring에서 실행</tspan><tspan x="795" dy="23">send_queue_ push</tspan><tspan x="795" dy="23">active_send_ev_ 확인</tspan></text>
<rect x="395" y="545" width="190" height="70" rx="12" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<text x="490" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="490" dy="0">closed</tspan><tspan x="490" dy="23">task drop</tspan></text>
<rect x="675" y="545" width="220" height="70" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<text x="785" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="785" dy="0">Kernel</tspan><tspan x="785" dy="23">sendmsg SQE submit</tspan></text>
<line x1="295" y1="202" x2="395" y2="202" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="540" y1="202" x2="625" y2="202" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="710" y1="267" x2="770" y2="350" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="740" y="258.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155"><tspan x="740" dy="0">yes</tspan></text>
<line x1="625" y1="215" x2="215" y2="350" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="330" y1="387" x2="395" y2="387" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="565" y1="387" x2="675" y2="387" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="620" y="378.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155"><tspan x="620" dy="0">yes</tspan></text>
<line x1="480" y1="452" x2="480" y2="545" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="540" y="443.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155"><tspan x="540" dy="0">no</tspan></text>
<line x1="785" y1="430" x2="785" y2="545" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="115" y="661.5" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#334155"><tspan x="115" dy="0">핵심: public API는 어느 thread에서 호출되어도 Session mutable state는 owner ring에서만 변경됩니다. Room output 순서는 별도 WorkerOutbox가 맡습니다.</tspan></text>
</svg>