<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 40 1060 790" role="img">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1e1e"/></marker></defs>
<rect x="40" y="40" width="1060" height="790" fill="#ffffff"/>
<text x="105" y="85.5" text-anchor="start" font-family="Arial, sans-serif" font-size="28" fill="#1e1e1e"><tspan x="105" dy="0">순서가 필요한 단위마다 owner와 FIFO를 둔다</tspan></text>
<text x="90" y="167.5" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#1e1e1e"><tspan x="90" dy="0">Room state</tspan></text>
<rect x="120" y="210" width="190" height="70" rx="12" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<text x="215" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="215" dy="0">room job #1</tspan><tspan x="215" dy="23">S_MOVE 결정</tspan></text>
<rect x="390" y="210" width="210" height="70" rx="12" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<text x="495" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="495" dy="0">room job #2</tspan><tspan x="495" dy="23">S_DESPAWN 결정</tspan></text>
<rect x="690" y="210" width="210" height="70" rx="12" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<text x="795" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="795" dy="0">TryJoin</tspan><tspan x="795" dy="23">IsFull + AddPlayer</tspan></text>
<line x1="310" y1="245" x2="390" y2="245" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="600" y1="245" x2="690" y2="245" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="90" y="377.5" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#1e1e1e"><tspan x="90" dy="0">WorkerOutbox</tspan></text>
<rect x="120" y="420" width="250" height="70" rx="12" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
<text x="245" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="245" dy="0">outbox[Session A]</tspan><tspan x="245" dy="23">S_MOVE -&gt; S_DESPAWN</tspan></text>
<rect x="470" y="420" width="250" height="70" rx="12" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
<text x="595" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="595" dy="0">outbox[Session B]</tspan><tspan x="595" dy="23">packet/task FIFO</tspan></text>
<rect x="805" y="420" width="145" height="70" rx="12" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
<text x="877.5" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="877.5" dy="0">DrainOutbox</tspan><tspan x="877.5" dy="23">phase</tspan></text>
<line x1="370" y1="455" x2="470" y2="455" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="720" y1="455" x2="805" y2="455" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="90" y="592.5" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#1e1e1e"><tspan x="90" dy="0">Session/socket</tspan></text>
<rect x="120" y="635" width="230" height="70" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="235" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="235" dy="0">Session::SendQueue</tspan><tspan x="235" dy="23">FIFO push</tspan></text>
<rect x="470" y="635" width="230" height="70" rx="12" fill="#c3fae8" stroke="#1e1e1e" stroke-width="2"/>
<text x="585" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="585" dy="0">active SendOp</tspan><tspan x="585" dy="23">in-flight 1개</tspan></text>
<rect x="805" y="635" width="160" height="70" rx="12" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
<text x="885" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="885" dy="0">partial retry</tspan><tspan x="885" dy="23">suffix 먼저</tspan></text>
<line x1="350" y1="670" x2="470" y2="670" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="700" y1="670" x2="805" y2="670" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="245" y1="280" x2="240" y2="420" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="505" y1="280" x2="595" y2="420" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="875" y1="490" x2="235" y2="635" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="120" y="746.5" text-anchor="start" font-family="Arial, sans-serif" font-size="17" fill="#334155"><tspan x="120" dy="0">Room은 상태 변경 순서, outbox는 session별 room output 순서, Session은 socket byte 순서를 각각 보장합니다.</tspan></text>
</svg>