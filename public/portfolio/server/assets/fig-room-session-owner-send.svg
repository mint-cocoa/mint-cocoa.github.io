<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 40 1100 820" role="img">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1e1e"/></marker></defs>
<rect x="40" y="40" width="1100" height="820" fill="#ffffff"/>
<text x="105" y="85.5" text-anchor="start" font-family="Arial, sans-serif" font-size="28" fill="#1e1e1e"><tspan x="105" dy="0">Room output은 WorkerOutbox를 거쳐 session별 FIFO가 된다</tspan></text>
<rect x="95" y="135" width="900" height="90" rx="12" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<text x="545" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="545" dy="0">Room JobQueue</tspan><tspan x="545" dy="23">job #1 S_MOVE, job #2 S_DESPAWN을 논리 순서대로 생성</tspan></text>
<rect x="95" y="295" width="230" height="70" rx="12" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<text x="210" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="210" dy="0">이전 remote path</tspan><tspan x="210" dy="23">RunOnRing 비동기</tspan></text>
<rect x="405" y="295" width="230" height="70" rx="12" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<text x="520" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="520" dy="0">이전 owner path</tspan><tspan x="520" dy="23">현재 ring이면 즉시 Send</tspan></text>
<rect x="715" y="295" width="245" height="70" rx="12" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<text x="837.5" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="837.5" dy="0">가능한 관측</tspan><tspan x="837.5" dy="23">S_DESPAWN -&gt; S_MOVE</tspan></text>
<line x1="325" y1="330" x2="405" y2="330" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="635" y1="330" x2="715" y2="330" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="95" y="455" width="310" height="90" rx="12" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
<text x="250" y="483.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="250" dy="0">WorkerOutbox</tspan><tspan x="250" dy="23">queues_[session]</tspan><tspan x="250" dy="23">S_MOVE -&gt; S_DESPAWN</tspan></text>
<rect x="485" y="455" width="210" height="90" rx="12" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
<text x="590" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="590" dy="0">IoWorker::DrainOutbox</tspan><tspan x="590" dy="23">budgeted drain phase</tspan></text>
<rect x="775" y="455" width="220" height="90" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="885" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="885" dy="0">Session::SendQueue</tspan><tspan x="885" dy="23">FIFO push</tspan></text>
<line x1="405" y1="500" x2="485" y2="500" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="695" y1="500" x2="775" y2="500" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="205" y="625" width="250" height="70" rx="12" fill="#c3fae8" stroke="#1e1e1e" stroke-width="2"/>
<text x="330" y="655" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="330" dy="0">active SendOp</tspan><tspan x="330" dy="23">sendmsg in-flight 1개</tspan></text>
<rect x="595" y="625" width="260" height="70" rx="12" fill="#c3fae8" stroke="#1e1e1e" stroke-width="2"/>
<text x="725" y="655" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="725" dy="0">partial send</tspan><tspan x="725" dy="23">남은 suffix 먼저 재제출</tspan></text>
<line x1="885" y1="545" x2="340" y2="625" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="455" y1="660" x2="595" y2="660" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="105" y="761.5" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#334155"><tspan x="105" dy="0">현재 ring이어도 즉시 Send하지 않고, room-originated output은 target worker outbox에 enqueue한 뒤 drain phase에서 Session::SendQueue로 들어갑니다.</tspan></text>
</svg>