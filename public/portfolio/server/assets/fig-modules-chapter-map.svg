<rect x="385" y="505" width="230" height="90" rx="12" fill="#c3fae8" stroke="#1e1e1e" stroke-width="2"/>
<text x="500" y="533.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="500" dy="0">RuntimeProxy</tspan><tspan x="500" dy="23">bytes -&gt; upstream/downstream</tspan><tspan x="500" dy="23">relay</tspan></text>
