project:
  type: website
  output-dir: _site

execute:
  freeze: auto

website:
  title: "배진후"
  description: "C++ 서버, DirectX 클라이언트, 홈랩 Kubernetes DevOps를 연결한 구현 중심 포트폴리오 허브"
  site-url: "https://mint-cocoa.github.io"
  repo-url: "https://github.com/mint-cocoa/mint-cocoa.github.io"
  repo-actions: [source, issue]
  repo-link-target: "_blank"
  navbar:
    search: true
    left:
      - text: "개요"
        href: index.qmd
      - text: "상세 문서"
        href: https://mint-cocoa.github.io/portfolio/
      - text: "서버"
        href: https://mint-cocoa.github.io/portfolio/server/ServerCorePortfolio.html
      - text: "클라이언트"
        href: https://mint-cocoa.github.io/portfolio/client/ClientPortfolio.html
      - text: "DevOps"
        href: https://mint-cocoa.github.io/portfolio/devops/DevOpsPortfolio.html
    right:
      - icon: github
        href: https://github.com/mint-cocoa
        aria-label: GitHub
  page-footer:
    left: "© 배진후"
    right:
      - icon: github
        href: https://github.com/mint-cocoa
        aria-label: GitHub

format:
  html:
    lang: ko
    theme: cosmo
    css: styles.css
    toc: false
    page-layout: article
    title-block-banner: false
    anchor-sections: true
    smooth-scroll: true
    link-external-icon: true
    link-external-newwindow: true
